# Equivalente ao appsettings.json + ConnectionStrings

# SQL Server (mesma base do projeto C#)
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=PainelSenhasJava;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sua_senha_aqui
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate (equivalente ao AddDbContext + Migrations)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Porta da aplicação
server.port=8080
