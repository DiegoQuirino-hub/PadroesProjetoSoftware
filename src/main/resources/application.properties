# Equivalente ao appsettings.json + ConnectionStrings

# SQLite (arquivo local, sem servidor de banco necessário)
spring.datasource.url=jdbc:sqlite:painelsenhas.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate (equivalente ao AddDbContext + Migrations)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Porta da aplicação
server.port=8080

# Swagger / OpenAPI — UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
