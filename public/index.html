<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Senhas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <a class="nav-brand" href="/">🎫 Painel de Senhas</a>
  <div class="nav-links">
    <a href="/atendente">Atendente</a>
    <a href="/display">Display</a>
    <a href="/login">Login</a>
  </div>
</nav>

<main>
  <div class="card">
    <h2>Sistema de Gerenciamento de Senhas</h2>
    <p style="color: var(--text-muted); margin-bottom: 32px;">
      Selecione o painel que deseja acessar:
    </p>

    <div class="home-grid">
      <a href="/atendente" class="home-card card-atendente">
        <div class="card-icon">🖥️</div>
        <h3>Painel do Atendente</h3>
        <p>Gere novas senhas e controle a fila de atendimento.</p>
      </a>

      <a href="/display" class="home-card card-display">
        <div class="card-icon">📺</div>
        <h3>Painel de Display</h3>
        <p>Exibe a senha sendo chamada em tempo real para os clientes.</p>
      </a>
    </div>
  </div>
</main>

</body>
</html>
