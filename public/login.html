<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso restrito — Painel de Senhas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='7' fill='%230E1719'/%3E%3Crect x='9' y='15' width='7' height='18' rx='1.5' fill='%23E86A17'/%3E%3Crect x='20.5' y='15' width='7' height='18' rx='1.5' fill='%23E86A17' opacity='.6'/%3E%3Crect x='32' y='15' width='7' height='18' rx='1.5' fill='%23E86A17' opacity='.35'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-auth">

<header class="topbar">
  <a class="brand" href="/">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand-name">Painel de Senhas</span>
  </a>
  <nav class="nav">
    <a href="/atendente">Atendente</a>
    <a href="/display">Display</a>
    <a href="/fluxo">Fluxo</a>
    <a href="/login">Login</a>
  </nav>
  <div class="status" data-status="on">
    <span class="lamp" aria-hidden="true"></span>
    <span class="status-label"></span>
    <span data-clock>--:--:--</span>
  </div>
</header>

<div class="shell">
  <div class="auth-wrap">
    <div class="auth-head">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1>Acesso restrito</h1>
    </div>

    <div class="segmented" role="tablist">
      <button id="seg-login" class="is-active" type="button" data-goto="login">Entrar</button>
      <button id="seg-register" type="button" data-goto="register">Criar conta</button>
    </div>

    <section class="panel" id="view-login">
      <div id="alert-login" class="toast" role="status"></div>
      <div class="field">
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" autocomplete="username" placeholder="voce@exemplo.com">
      </div>
      <div class="field">
        <label for="login-senha">Senha</label>
        <input id="login-senha" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="key key--block" id="btnLogin" type="button">Entrar</button>
      <p class="auth-alt">Não tem conta? <button type="button" data-goto="register">Criar conta</button></p>
    </section>

    <section class="panel" id="view-register" hidden>
      <div id="alert-register" class="toast" role="status"></div>
      <div class="field">
        <label for="reg-email">E-mail</label>
        <input id="reg-email" type="email" autocomplete="username" placeholder="voce@exemplo.com">
      </div>
      <div class="field">
        <label for="reg-senha">Senha</label>
        <input id="reg-senha" type="password" autocomplete="new-password" placeholder="Ao menos 6 caracteres">
      </div>
      <button class="key key--block" id="btnRegister" type="button">Criar conta</button>
      <p class="auth-alt">Já tem conta? <button type="button" data-goto="login">Entrar</button></p>
    </section>
  </div>
</div>

<footer class="foot">Painel de Senhas · demonstração do padrão Singleton</footer>

<script src="/js/shell.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
