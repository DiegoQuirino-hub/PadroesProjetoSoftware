<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamada — Painel de Senhas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='7' fill='%230E1719'/%3E%3Crect x='9' y='15' width='7' height='18' rx='1.5' fill='%23E86A17'/%3E%3Crect x='20.5' y='15' width='7' height='18' rx='1.5' fill='%23E86A17' opacity='.6'/%3E%3Crect x='32' y='15' width='7' height='18' rx='1.5' fill='%23E86A17' opacity='.35'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-display">

<div id="offlineBanner" class="wall-offline" hidden>Sem conexão com o servidor — última chamada pode estar desatualizada</div>

<header class="topbar">
  <a class="brand" href="/">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand-name">Painel de Senhas</span>
  </a>
  <div class="status" data-status="on">
    <span class="lamp" aria-hidden="true"></span>
    <span class="status-label"></span>
    <span data-clock>--:--:--</span>
  </div>
</header>

<main class="wall">
  <div class="wall-main">
    <p class="eyebrow">Senha</p>
    <div class="bezel">
      <div class="readout is-empty" id="senhaAtual" role="img" aria-label="Senha chamada"></div>
    </div>
    <p class="wall-caption">Dirija-se ao atendimento</p>
  </div>

  <aside class="wall-side">
    <div class="section-head"><span>Últimas chamadas</span></div>
    <ul class="ledger" id="historico">
      <li class="ledger-empty">Aguardando chamadas…</li>
    </ul>
  </aside>
</main>

<footer class="foot">
  nó do servidor <b id="instanceId">…</b> · atualização a cada 2 s
</footer>

<script src="/js/shell.js"></script>
<script src="/js/display.js"></script>
</body>
</html>
